# ============================================================
# Bus Booking Platform - Complete Docker Compose Configuration
# ============================================================
# Usage:
#   Start all services:    docker compose up -d
#   Stop all services:     docker compose down
#   View logs:             docker compose logs -f <service-name>
#   Rebuild after changes: docker compose up -d --build <service-name>
# ============================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ==================== INFRASTRUCTURE ====================

  # MySQL Database (shared instance, separate databases per service)
  mysql:
    image: mysql:8.0
    container_name: mysql-local
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql  # Auto-creates all 4 databases
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  # Redis Cache (Isolated on host port 6380)
  redis:
    image: redis:7-alpine
    container_name: redis-local
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # Apache Kafka (KRaft mode - no Zookeeper needed)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-local
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    logging: *default-logging

  # Kafka UI (Optional - for debugging/monitoring Kafka topics)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: 'local-kraft'
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka:29092'
    depends_on:
      kafka:
        condition: service_started
    logging: *default-logging

  # Redis Commander (Isolated Web UI for personal project Redis)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: 'PersonalRedis:redis:6379'
    depends_on:
      redis:
        condition: service_started
    logging: *default-logging

  # ==================== MICROSERVICES ====================

  # API Gateway (Port 8080) - Entry point for all requests
  api-gateway:
    build: ./backend/api-getway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"
      USERS_SERVICE_URL: http://users-service:6005
      BUS_SERVICE_URL: http://bus-service:8005
      BOOKING_SERVICE_URL: http://booking-service:8006
      PAYMENT_SERVICE_URL: http://payment-service:8007
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:3001
    depends_on:
      users-service:
        condition: service_started
      bus-service:
        condition: service_started
      booking-service:
        condition: service_started
      payment-service:
        condition: service_started
    logging: *default-logging

  # Users Service (Port 6005) - Auth, registration, profile, master list
  users-service:
    build: ./backend/users
    container_name: users-service
    restart: unless-stopped
    ports:
      - "6005:6005"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bus_users_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      mysql:
        condition: service_started
      kafka:
        condition: service_started
    logging: *default-logging

  # Bus Service (Port 8005) - Fleet management, routes, search, reviews
  bus-service:
    build: ./backend/bus
    container_name: bus-service
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bus_fleet_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      BOOKING_SERVICE_URL: http://booking-service:8006
      REVIEW_PROCESSING_CRON: ${REVIEW_PROCESSING_CRON:-0 */1 * * * *}
    depends_on:
      mysql:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_started
    logging: *default-logging

  # Booking Service (Port 8006) - Seat locking, bookings, PNR, cancellations
  booking-service:
    build: ./backend/booking-service
    container_name: booking-service
    restart: unless-stopped
    ports:
      - "8006:8006"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bus_booking_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      BUS_SERVICE_URL: http://bus-service:8005
      USER_SERVICE_URL: http://users-service:6005
    depends_on:
      mysql:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_started
    logging: *default-logging

  # Payment Service (Port 8007) - Payment processing, transaction management
  payment-service:
    build: ./backend/payment
    container_name: payment-service
    restart: unless-stopped
    ports:
      - "8007:8007"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bus_payment_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      mysql:
        condition: service_started
      kafka:
        condition: service_started
    logging: *default-logging

  # Notifications Service (Port 7005) - Email consumer (OTP, tickets, welcome)
  notifications-service:
    build: ./backend/notifications
    container_name: notifications-service
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_started
    logging: *default-logging

# ==================== VOLUMES ====================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local
