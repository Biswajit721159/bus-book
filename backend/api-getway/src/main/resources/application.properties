spring.application.name=api-getway
server.port=8080

# Optional environment file imports for local development
spring.config.import=optional:file:.env[.properties],optional:file:../../.env[.properties]

# Target Service URLs (can be overridden by environment variables in production)
services.users.url=${USERS_SERVICE_URL:http://localhost:6005}
services.bus.url=${BUS_SERVICE_URL:http://localhost:8005}
services.booking.url=${BOOKING_SERVICE_URL:http://localhost:8006}
services.payment.url=${PAYMENT_SERVICE_URL:http://localhost:8007}

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=${REGISTER_WITH_EUREKA:false}
eureka.client.fetch-registry=${FETCH_REGISTRY:false}

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:3001}

# JWT Configuration
jwt.secret=${JWT_SECRET_KEY:}

# Internal Gateway Secret
gateway.internal.secret=${GATEWAY_INTERNAL_SECRET:bus-booking-internal-secret-token}

# ================= CLEAN LOGGING CONFIGURATION =================
logging.level.root=INFO
logging.level.com.entry.api_getway=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.filter=WARN
logging.level.org.apache.catalina=WARN
