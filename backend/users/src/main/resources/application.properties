spring.application.name=users
server.port=6005

# Optional environment file imports for local development
spring.config.import=optional:file:.env[.properties],optional:file:../../.env[.properties]

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bus_users_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Google OAuth Configuration
google.client.id=${GOOGLE_CLIENT_ID:108453954374-2lhpjgeuvlsvnrf299ggopipiolvvpca.apps.googleusercontent.com}

# JWT Configuration
jwt.secret=${JWT_SECRET_KEY:default-bus-booking-jwt-secret-key-32chars-minimum}

# Internal Gateway Secret
gateway.internal.secret=${GATEWAY_INTERNAL_SECRET:bus-booking-internal-secret-token}

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:3001,http://localhost:8080}

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# ================= CLEAN LOGGING CONFIGURATION =================
logging.level.root=INFO
logging.level.com.auth.users=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.filter=WARN
logging.level.org.apache.catalina=WARN
logging.level.org.hibernate=WARN
logging.level.org.apache.kafka=WARN